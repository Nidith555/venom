services:
  - type: web
    name: venom-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: VENOM_ENGINE
        value: gemini
      - key: VENOM_MODEL
        value: gemini-3.1-flash-lite
      - key: VENOM_GEMINI_API_KEY
        sync: false
      - key: VENOM_ELEVENLABS_API_KEY
        sync: false
      - key: VENOM_ELEVENLABS_VOICE_ID
        value: cgSgspJ2msm6clMCkdW9
      - key: VENOM_ELEVENLABS_MODEL_ID
        value: eleven_multilingual_v2
